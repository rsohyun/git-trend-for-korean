# 일간 GitHub 트렌딩 (D46, D53): GitHub 공식 트렌딩 수집·요약·노트·사이트 생성 → 커밋 → Vercel 자동 배포 → 메일
name: gittrend-daily
on:
  # GitHub 예약 실행은 자주 늦거나 빠진다(D52). 여러 시각에 걸어 두고, 그날 이미 실행했으면 건너뛴다.
  # KST 08:07 / 08:37 / 10:17 / 12:17 (D54). GitHub 트렌딩은 실시간 집계라 시각은 출근 전에 메일을 받도록 맞춘 것.
  # 정각은 예약이 몰려 피한다. cron은 UTC라 08:07 KST는 전날 23:07 UTC
  schedule:
    - cron: "7 23 * * *"
    - cron: "37 23 * * *"
    - cron: "17 1 * * *"
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read  # 기본은 읽기 전용, 커밋하는 daily 잡만 쓰기 권한

concurrency:
  group: gittrend-daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.c.outputs.done }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # 트리거 시점이 아니라 최신 커밋을 봐야 앞선 실행의 결과가 보인다
          sparse-checkout: vault/30-Trends/.trending-days
      - id: c
        run: |
          f="vault/30-Trends/.trending-days/$(TZ=Asia/Seoul date +%F).json"
          if [ -f "$f" ]; then echo "done=true" >> "$GITHUB_OUTPUT"; echo "오늘 실행 완료: $f"; fi

  daily:
    needs: check
    if: github.event_name != 'schedule' || needs.check.outputs.done != 'true'  # 수동 실행은 항상 진행
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      AI_WORKER_TOKEN: cli  # Settings 필수값. CLI는 HTTP 인증을 쓰지 않는다
      LLM_PROVIDER: openai_compat
      LLM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
      LLM_MODEL: gemini-3.5-flash-lite  # D47
      LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # README 조회
      SITE_URL: ${{ vars.SITE_URL }}  # 비어 있으면 메일 링크는 GitHub로 연결
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-worker/pyproject.toml
      - name: Install ai-worker
        run: pip install -e ./ai-worker
      - name: Collect, summarize, build site
        working-directory: ai-worker
        run: python -m app.cli gittrend --mail-out "$RUNNER_TEMP/mail.json"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vault/30-Trends site
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: trending $(TZ=Asia/Seoul date +%F)"
          git pull --rebase
          git push
      - name: Wait for Vercel deploy
        run: sleep 60  # 메일의 사이트 링크를 열었을 때 그날 데이터가 보이도록
      - name: Send mail
        working-directory: ai-worker
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m app.cli send-mail "$RUNNER_TEMP/mail.json"
